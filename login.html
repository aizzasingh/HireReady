<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — HireReady</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

  <div class="auth-wrap">

    <!-- left panel -->
    <aside class="auth-left" aria-hidden="true">
      <a href="index.html" class="riq-logo"><img src="logo2.png" style="height: 60px;" alt="logo"></a>
      <div class="auth-left-content">
        <blockquote class="auth-quote">"My ATS score went from 54% to 89% in one afternoon."</blockquote>
        <p class="auth-quote-author">— Software Engineer, Bangalore</p>
      </div>
      <div class="auth-left-deco"></div>
    </aside>

    <!-- main panel (form panel) -->
    <main class="auth-right">
      <div class="auth-form-wrap">
        <a href="index.html" class="riq-logo auth-logo-mobile"><img src="logo2.png" style="height: 60px;" alt="logo"></a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Log in to your HireReady account.</p>

        <div id="loginAlert" class="alert alert-danger" aria-live="polite"></div>
        <!--form start-->
        <form id="loginForm" novalidate aria-label="Login form">
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="you@email.com" autocomplete="email" required
              aria-describedby="emailErr" />
            <p class="form-error" id="emailErr">Please enter a valid email address.</p>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="password">Password</label>
              <a href="#" class="link-sm">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <input type="password" id="password" class="form-input" placeholder=" " autocomplete="current-password"
                required aria-describedby="passErr" />
              <button type="button" class="eye-btn" onclick="togglePass('password', this)"
                aria-label="Toggle password visibility">👁</button>
            </div>
            <p class="form-error" id="passErr">Password is required.</p>
          </div>

          <div class="form-check">
            <input type="checkbox" id="remember" />
            <label for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn btn-solid btn-lg btn-w100">Log in</button>
        </form>

        <div class="divider" aria-hidden="true">or</div>

        <button class="btn btn-outline btn-w100" onclick="alert('Google authentication coming soon')">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="" />
          Continue with Google
        </button>

        <p class="auth-switch">Don't have an account? <a href="register.html" class="link">Sign up
            free</a></p>
      </div>
    </main>

  </div>

  <script src="user.js"></script>
  <script src="auth.js"></script>
</body>

</html>
